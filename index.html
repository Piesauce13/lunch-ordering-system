<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Lunch Queue</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      overflow-y: scroll;
      scrollbar-gutter: stable;
    }

    :root {
      --bg: #efede4;
      --surface: #e6e3d9;
      --surface-soft: #ece9df;
      --card: #f6f5f1;
      --line: #d9d5ca;
      --text: #374737;
      --muted: #7a7f72;
      --accent: #3f5c37;
      --accent-2: #a84a1f;
      --success: #2f7d42;
      --error: #be3b2c;
      --info: #3a6ea8;
      --radius: 18px;
      --shadow: 0 8px 24px rgba(54, 65, 52, 0.08);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", sans-serif;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      overflow-y: scroll;
      padding: 16px;
      scrollbar-gutter: stable;
      margin: 0;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(2px);
    }

    body::before {
      width: 380px;
      height: 380px;
      top: -140px;
      right: -90px;
      background: radial-gradient(circle at center, rgba(113, 140, 100, 0.22), rgba(113, 140, 100, 0));
    }

    body::after {
      width: 320px;
      height: 320px;
      left: -120px;
      bottom: -100px;
      background: radial-gradient(circle at center, rgba(206, 129, 82, 0.2), rgba(206, 129, 82, 0));
    }

    .card {
      background: var(--card);
      border: none;
      border-radius: 28px;
      box-shadow: 
        0 0 30px rgba(168, 74, 31, 0.15),
        0 0 15px rgba(63, 92, 55, 0.1),
        0 12px 32px rgba(54, 65, 52, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
      padding: 48px 42px;
      width: 100%;
      max-width: 420px;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-2), transparent);
      filter: blur(1px);
    }

    .card::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      filter: blur(1px);
    }

    .logo {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--accent) 0%, #5a7d52 100%);
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 28px;
      margin-bottom: 24px;
      box-shadow: 0 8px 16px rgba(63, 92, 55, 0.2);
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.9rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #3e5139;
      position: relative;
      display: inline-block;
      letter-spacing: -0.5px;
    }

    h1::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 48px;
      height: 3px;
      border-radius: 99px;
      background: var(--accent-2);
    }

    p.sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 36px;
      margin-top: 12px;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    label {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input {
      width: 100%;
      background: linear-gradient(135deg, #fafaf8 0%, #f8f8f6 100%);
      border: 1.5px solid transparent;
      color: var(--text);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
      position: relative;
    }

    input::placeholder {
      color: #a8ad9f;
    }

    input:focus { 
      border-color: var(--accent);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(63, 92, 55, 0.08), 0 4px 12px rgba(63, 92, 55, 0.12);
    }

    input:hover:not(:focus) {
      border-color: rgba(63, 92, 55, 0.2);
    }

    .error-msg {
      color: var(--error);
      font-size: 0.82rem;
      margin-top: 16px;
      min-height: 18px;
      text-align: center;
      font-weight: 500;
      animation: error-shake 0.4s ease-in-out;
    }

    @keyframes error-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, var(--accent) 0%, #358b3d 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.3s ease;
      box-shadow: 0 6px 16px rgba(63, 92, 55, 0.25);
      letter-spacing: 0.3px;
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    button:hover::before {
      left: 100%;
    }

    button:hover { 
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(63, 92, 55, 0.35);
    }

    button:active { 
      transform: translateY(0);
      box-shadow: 0 4px 12px rgba(63, 92, 55, 0.25);
    }

    button:disabled { 
      opacity: 0.6; 
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">🍽</div>
    <h1>Lunch Queue</h1>
    <p class="sub">Sign in to continue</p>

    <div class="form-group">
      <label for="nameInput">Name</label>
      <input type="text" id="nameInput" placeholder="e.g. Sokvisoth" />
    </div>

    <div class="form-group">
      <label for="passwordInput">Password</label>
      <input type="password" id="passwordInput" placeholder="••••••••" />
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <button id="loginBtn">Sign In</button>
  </div>

  <script type="module">
    import firebaseService from "./Firebase/CRUD.js";

    const nameInput     = document.getElementById("nameInput");
    const passwordInput = document.getElementById("passwordInput");
    const loginBtn      = document.getElementById("loginBtn");
    const errorMsg      = document.getElementById("errorMsg");

    loginBtn.addEventListener("click", async () => {
      const name     = nameInput.value.trim();
      const password = passwordInput.value.trim();

      if (!name || !password) {
        errorMsg.textContent = "Please enter your name and password.";
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerHTML = `<span class="spinner"></span>Signing in...`;
      errorMsg.textContent = "";

      const result = await firebaseService.login(name, password);

      if (result.success) {
        sessionStorage.setItem("currentUser", JSON.stringify(result.user));
        window.location.href = "./receptionist.html";
      } else {
        errorMsg.textContent = result.message || "Invalid name or password.";
        loginBtn.disabled = false;
        loginBtn.textContent = "Sign In";
      }
    });

    // Allow Enter key
    passwordInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") loginBtn.click();
    });
  </script>

</body>
</html>
