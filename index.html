<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Lunch Queue</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f1117;
      --surface: #1a1d27;
      --border:  #2a2d3a;
      --accent:  #f97316;
      --text:    #e8eaf0;
      --muted:   #6b7080;
      --error:   #ef4444;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
    }

    .logo {
      width: 48px; height: 48px;
      background: var(--accent);
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 24px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    p.sub {
      color: var(--muted);
      font-size: 0.88rem;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--accent); }

    .error-msg {
      color: var(--error);
      font-size: 0.82rem;
      margin-top: 12px;
      min-height: 18px;
      text-align: center;
    }

    button {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">🍽</div>
    <h1>Lunch Queue</h1>
    <p class="sub">Sign in to continue</p>

    <div class="form-group">
      <label for="nameInput">Name</label>
      <input type="text" id="nameInput" placeholder="e.g. Sokvisoth" />
    </div>

    <div class="form-group">
      <label for="passwordInput">Password</label>
      <input type="password" id="passwordInput" placeholder="••••••••" />
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <button id="loginBtn">Sign In</button>
  </div>

  <script type="module">
    import firebaseService from "./Firebase/CRUD.js";

    const nameInput     = document.getElementById("nameInput");
    const passwordInput = document.getElementById("passwordInput");
    const loginBtn      = document.getElementById("loginBtn");
    const errorMsg      = document.getElementById("errorMsg");

    loginBtn.addEventListener("click", async () => {
      const name     = nameInput.value.trim();
      const password = passwordInput.value.trim();

      if (!name || !password) {
        errorMsg.textContent = "Please enter your name and password.";
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerHTML = `<span class="spinner"></span>Signing in...`;
      errorMsg.textContent = "";

      const result = await firebaseService.login(name, password);

      if (result.success) {
        sessionStorage.setItem("currentUser", JSON.stringify(result.user));
        window.location.href = "./receptionist.html";
      } else {
        errorMsg.textContent = result.message || "Invalid name or password.";
        loginBtn.disabled = false;
        loginBtn.textContent = "Sign In";
      }
    });

    // Allow Enter key
    passwordInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") loginBtn.click();
    });
  </script>

</body>
</html>
