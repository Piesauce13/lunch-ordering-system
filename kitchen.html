<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kitchen Dashboard — Lunch Queue</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>Lunch Queue</h1>
        <span class="subtitle">Kitchen Dashboard</span>
      </div>
      
      <div class="header-right">
        <nav class="header-nav">
          <a href="./receptionist.html" class="nav-link">Receptionist</a>
          <button id="logoutBtn" class="nav-btn">Logout</button>
        </nav>
        <div class="kitchen-stats">
          <div class="stat-item">
            <span class="stat-label">Pending</span>
            <span class="stat-value" id="pendingCount">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Ready</span>
            <span class="stat-value" id="readyCount">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Done</span>
            <span class="stat-value done" id="completedCount">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Cancelled</span>
            <span class="stat-value done" id="cancelledCount">0</span>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="panel">
        <div class="panel-title-row">
          <h2>Orders</h2>
          <div class="panel-controls">
            <select id="statusFilter">
              <option value="all">All Orders</option>
              <option value="pending">Pending</option>
              <option value="ready">Ready</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
            <button id="refreshBtn" class="refresh-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
              Refresh
            </button>
          </div>
        </div>

        <div class="order-grid" id="orderList"></div>
      </section>
    </main>

    <footer>
      <div>
        <strong>Lunch Queue</strong>
        Handcrafted for modern workspaces
      </div>
      <div>© 2026 Lunch Queue. All rights reserved.</div>
    </footer>
  </div>

  <div id="toast"></div>
  <div id="spinner"><div class="spinner-ring"></div></div>
  <script type="module">
    document.getElementById("logoutBtn").addEventListener("click", () => {
      sessionStorage.removeItem("currentUser");
      window.location.href = "./index.html";
    });
  </script>
  <script type="module" src="js/kitchen.js"></script>
</body>
</html>
