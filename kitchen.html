<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kitchen Dashboard — Lunch Queue</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>Lunch Queue</h1>
        <span class="subtitle">Kitchen Dashboard</span>
      </div>
      
      <div class="header-right">
        <nav class="header-nav">
          <a href="./receptionist.html" class="nav-link">Receptionist</a>
          <button id="logoutBtn" class="nav-btn">Logout</button>
        </nav>
        <div class="kitchen-stats">
          <div class="stat-item">
            <span class="stat-label">Pending</span>
            <span class="stat-value" id="pendingCount">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Done</span>
            <span class="stat-value done" id="completedCount">0</span>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="panel">
        <h2>Orders</h2>
        <div class="panel-header">
          <select id="statusFilter">
            <option value="pending">Pending</option>
            <option value="completed">Done</option>
            <option value="all">All Orders</option>
          </select>
          <button id="refreshBtn" class="refresh-btn">Refresh</button>
        </div>

        <div class="order-grid" id="orderList"></div>
      </section>
    </main>

    <footer>
      <div>
        <strong>Lunch Queue</strong>
        Handcrafted for modern workspaces
      </div>
      <div>© 2026 Lunch Queue. All rights reserved.</div>
    </footer>
  </div>

  <div id="toast"></div>
  <div id="spinner"><div class="spinner-ring"></div></div>
  <script type="module">
    document.getElementById("logoutBtn").addEventListener("click", () => {
      sessionStorage.removeItem("currentUser");
      window.location.href = "./index.html";
    });
  </script>
  <script type="module" src="js/kitchen.js"></script>
</body>
</html>
