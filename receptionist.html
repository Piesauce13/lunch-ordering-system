<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Receptionist — Lunch Queue</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --border:   #2a2d3a;
      --accent:   #f97316;
      --accent2:  #fb923c;
      --text:     #e8eaf0;
      --muted:    #6b7080;
      --success:  #22c55e;
      --error:    #ef4444;
      --info:     #3b82f6;
      --radius:   12px;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px;
    }

    header {
      max-width: 1100px;
      margin: 0 auto 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }

    header .logo {
      width: 40px; height: 40px;
      background: var(--accent);
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 20px;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    header span {
      font-size: 0.85rem;
      color: var(--muted);
      margin-left: auto;
    }

    .layout {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
    }

    /* ── Left Panel ── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .panel h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-size: 0.75rem;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    select, input[type="text"], input[type="number"], textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    select:focus, input:focus, textarea:focus {
      border-color: var(--accent);
    }

    select option { background: var(--surface); }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      padding: 10px 20px;
      white-space: nowrap;
    }

    .btn-primary:hover:not(:disabled) { background: var(--accent2); }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Meal Grid ── */
    #mealGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 4px;
      max-height: 460px;
      overflow-y: auto;
      padding-right: 4px;
    }

    #mealGrid::-webkit-scrollbar { width: 4px; }
    #mealGrid::-webkit-scrollbar-track { background: transparent; }
    #mealGrid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .meal-card {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
    }

    .meal-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .meal-card.selected { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(249,115,22,0.2); }

    .meal-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }

    .meal-card p {
      font-size: 0.75rem;
      padding: 8px;
      text-align: center;
      line-height: 1.3;
      color: var(--text);
    }

    .no-results {
      color: var(--muted);
      font-size: 0.9rem;
      grid-column: 1 / -1;
      text-align: center;
      padding: 32px 0;
    }

    /* ── Right Panel (Order Form) ── */
    .meal-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
    }

    #selectedMealImg {
      width: 56px; height: 56px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--border);
      flex-shrink: 0;
    }

    .meal-preview-info small {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #selectedMealName {
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 2px;
      color: var(--accent);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    textarea { resize: vertical; min-height: 72px; }

    #submitBtn {
      width: 100%;
      padding: 13px;
      font-size: 1rem;
      border-radius: 10px;
      margin-top: 4px;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 24px;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      z-index: 999;
      white-space: nowrap;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    #toast.toast-success { border-color: var(--success); color: var(--success); }
    #toast.toast-error   { border-color: var(--error);   color: var(--error);   }
    #toast.toast-info    { border-color: var(--info);     color: var(--info);    }

    /* ── Spinner ── */
    #spinner {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,17,23,0.6);
      backdrop-filter: blur(2px);
      z-index: 998;
      place-items: center;
    }

    #spinner.show { display: grid; }

    .spinner-ring {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <div class="logo">🍽</div>
    <h1>Lunch Queue</h1>
    <span>Receptionist Panel</span>
  </header>

  <div class="layout">

    <!-- Left: Menu Browser -->
    <div class="panel">
      <h2>Browse Menu</h2>

      <!-- Category dropdown -->
      <select id="categorySelect">
        <option value="">-- Select Category --</option>
      </select>

      <div class="divider">or search</div>

      <!-- Search bar -->
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Search meals..." />
        <button class="btn-primary" id="searchBtn">Search</button>
      </div>

      <!-- Meal cards -->
      <div id="mealGrid"></div>
    </div>

    <!-- Right: Order Form -->
    <div class="panel">
      <h2>Place Order</h2>

      <!-- Selected meal preview -->
      <div class="meal-preview">
        <img id="selectedMealImg" src="" alt="meal" />
        <div class="meal-preview-info">
          <small>Selected Meal</small>
          <div id="selectedMealName">None</div>
        </div>
      </div>

      <!-- Order form -->
      <form id="orderForm">
        <div class="form-group">
          <label for="employeeName">Employee Name</label>
          <input type="text" id="employeeName" placeholder="e.g. Sokvisoth" required />
        </div>

        <div class="form-group">
          <label for="quantity">Quantity</label>
          <input type="number" id="quantity" value="1" min="1" max="20" required />
        </div>

        <div class="form-group">
          <label for="notes">Notes (optional)</label>
          <textarea id="notes" placeholder="e.g. No spicy, extra rice..."></textarea>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">Place Order</button>
      </form>
    </div>

  </div>

  <!-- Toast notification -->
  <div id="toast"></div>

  <!-- Spinner overlay -->
  <div id="spinner"><div class="spinner-ring"></div></div>

  <!-- Entry point — type="module" required for ES imports -->
  <script type="module" src="js/receptionist.js"></script>

</body>
</html>
