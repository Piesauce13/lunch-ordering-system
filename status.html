<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Status — Lunch Queue</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .status-page { max-width: 600px; margin: 0 auto; padding: 20px; }
    .status-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 20px;
      box-shadow: var(--shadow);
    }
    .status-result { padding: 16px; border-radius: 12px; text-align: center; }
    .status-result.pending { background: #dbeafe; border: 2px solid #3a6ea8; }
    .status-result.ready { background: #dcfce7; border: 2px solid #2f7d42; }
    .status-result.done { background: #e5e7eb; border: 2px solid #6b7280; }
    .status-result h2 { font-size: 1.5rem; margin-bottom: 8px; }
    .status-result p { font-size: 1.1rem; }
    .search-box {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .search-box input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--line);
      font-size: 1rem;
    }
    .search-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(63,92,55,0.1); }
    .search-box button {
      padding: 14px 24px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .order-list { margin-top: 20px; }
    .order-item {
      background: var(--surface);
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .order-item .name { font-weight: 600; font-size: 1.1rem; }
    .order-item .meal { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
    .order-item .status { padding: 6px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="page status-page">
    <header>
      <h1>Lunch Queue</h1>
      <span>Check Your Order</span>
    </header>

    <main>
      <div class="status-card">
        <h2 style="margin-bottom: 16px;">Enter Your Name</h2>
        <div class="search-box">
          <input type="text" id="nameInput" placeholder="Enter your name..." />
          <button id="searchBtn">Check Status</button>
        </div>
        <div id="resultArea"></div>
      </div>
    </main>
  </div>

  <div id="toast"></div>
  <div id="spinner"><div class="spinner-ring"></div></div>
  <script type="module">
    import { showToast, showSpinner } from "./js/utils.js";
    import firebaseService from "./Firebase/CRUD.js";

    const nameInput = document.getElementById("nameInput");
    const searchBtn = document.getElementById("searchBtn");
    const resultArea = document.getElementById("resultArea");

    searchBtn.addEventListener("click", async () => {
      const name = nameInput.value.trim();
      if (!name) {
        showToast("Please enter your name", "error");
        return;
      }
      await checkStatus(name.toLowerCase());
    });

    nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") searchBtn.click();
    });

    async function checkStatus(name) {
      showSpinner(true);
      try {
        const orders = await firebaseService.getOrders();
        const myOrders = orders.filter(o => 
          o.employeeName.toLowerCase().includes(name) && 
          o.status !== "completed"
        ).sort((a, b) => {
          const dateA = a.created_at?.toDate?.() || new Date(a.created_at);
          const dateB = b.created_at?.toDate?.() || new Date(b.created_at);
          return dateB - dateA;
        });

        if (myOrders.length === 0) {
          resultArea.innerHTML = `
            <div class="status-result done" style="margin-top: 20px;">
              <h2>No Active Orders</h2>
              <p>No pending orders found for "${name}"</p>
            </div>
          `;
        } else {
          const itemsHtml = await Promise.all(myOrders.slice(0, 5).map(async (order) => {
            const items = await firebaseService.getOrderItemsByOrder(order.id);
            const mealName = items[0]?.mealName || "Unknown";
            return `
              <div class="order-item">
                <div>
                  <div class="name">${order.orderNumber}</div>
                  <div class="meal">${mealName}</div>
                </div>
                <span class="status ${order.status}">${order.status === "ready" ? "Ready!" : "Preparing..."}</span>
              </div>
            `;
          }));
          resultArea.innerHTML = `
            <div class="status-result ${myOrders[0].status}" style="margin-top: 20px;">
              <h2>${myOrders[0].status === "ready" ? "Your Order is Ready!" : "Preparing..."}</h2>
              <p>Order #${myOrders[0].orderNumber}</p>
            </div>
            <div class="order-list">${itemsHtml.join("")}</div>
          `;
        }
      } catch (err) {
        console.error(err);
        showToast("Error checking status", "error");
      } finally {
        showSpinner(false);
      }
    }
  </script>
</body>
</html>
